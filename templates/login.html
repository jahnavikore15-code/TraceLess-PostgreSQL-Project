{% extends "base.html" %}{% block title %}Login · TraceLess{% endblock %}
{% block content %}
<section class="auth-card">
  <div class="brand large"><span class="brand-icon">T</span> TraceLess</div>
  <p class="eyebrow">YOUR DIGITAL LIFE, ORGANIZED</p><h1>Welcome back</h1><p class="muted">Sign in to review your digital footprint.</p>
  <form method="post" class="stack">
    <label>Email<input type="email" name="email" placeholder="you@example.com" required></label>
    <label>Password<input type="password" name="password" placeholder="Your password" required></label>
    <button class="btn primary" type="submit">Log in</button>
  </form>
  <p class="muted center">New to TraceLess? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
